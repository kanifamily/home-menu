<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週間ごはんメニュー</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 14px;
}

h1 {
  text-align: center;
  font-size: 22px;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 14px 0;
}

button {
  background: #2a2a2a;
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 14px;
}

#weekTitle {
  font-size: 15px;
  color: #d6a85c;
}

.week {
  display: grid;
  gap: 10px;
}

.day {
  background: #1f1f1f;
  border-radius: 14px;
  padding: 12px;
}

.date {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 8px;
}

.sun .date,
.holiday .date {
  color: #ff6b6b;
}

.sat .date {
  color: #4da3ff;
}

.meal {
  font-size: 14px;
  margin-top: 5px;
}

.meal span {
  display: inline-block;
  width: 28px;
  color: #d6a85c;
  font-weight: 700;
}

.breakfast,
.lunch {
  color: #aaa;
}

.dinner {
  font-size: 18px;
  font-weight: 800;
  margin-top: 8px;
  background: rgba(255, 184, 77, 0.1);
  border-left: 4px solid #ffb84d;
  padding: 6px 8px;
  border-radius: 6px;
}

.memo {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

.week-notes {
  margin-top: 22px;
}

.note-card {
  background: #1f1f1f;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
}

.note-card h3 {
  margin: 0 0 4px;
  font-size: 14px;
  color: #d6a85c;
}

.note-card p {
  margin: 0;
  font-size: 13px;
  color: #ccc;
}
</style>
</head>

<body>

<h1>週間ごはんメニュー</h1>

<div class="controls">
  <button onclick="changeWeek(-1)">← 前週</button>
  <div id="weekTitle"></div>
  <button onclick="changeWeek(1)">次週 →</button>
</div>

<div class="week" id="week"></div>

<section class="week-notes">
  <div class="note-card">
    <h3>毎週水曜</h3>
    <p>カレー・ハヤシライス・シチューなど</p>
  </div>
  <div class="note-card">
    <h3>毎週金曜</h3>
    <p>冷蔵庫整理・余りものOK</p>
  </div>
</section>

<script>
const CSV_URL = "ここにGoogleシートのCSV URL";

let menus = {};
let holidays = {};
let currentWeekOffset = 0;

const weekNames = ["日", "月", "火", "水", "木", "金", "土"];

fetch("https://holidays-jp.github.io/api/v1/date.json")
  .then(res => res.json())
  .then(data => {
    holidays = data;
    return fetch(CSV_URL);
  })
  .then(res => res.text())
  .then(csv => {
    menus = csvToMenus(csv);
    renderWeek();
  })
  .catch(() => {
    renderWeek();
  });

function csvToMenus(csv) {
  const lines = csv.trim().split("\n").slice(1);
  const result = {};

  lines.forEach(line => {
    const cols = line.split(",");

    const date = cols[0]?.trim();
    const breakfast = cols[1]?.trim();
    const lunch = cols[2]?.trim();
    const dinner = cols[3]?.trim();
    const memo = cols[4]?.trim();

    if (!date) return;

    result[date] = { breakfast, lunch, dinner, memo };
  });

  return result;
}

function getStartOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay() + currentWeekOffset * 7);
  return d;
}

function formatKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function changeWeek(amount) {
  currentWeekOffset += amount;
  renderWeek();
}

function renderWeek() {
  const weekEl = document.getElementById("week");
  const titleEl = document.getElementById("weekTitle");

  weekEl.innerHTML = "";

  const start = getStartOfWeek(new Date());
  const end = new Date(start);
  end.setDate(start.getDate() + 6);

  titleEl.textContent =
    `${start.getMonth() + 1}/${start.getDate()}〜${end.getMonth() + 1}/${end.getDate()}`;

  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);

    const key = formatKey(d);
    const menu = menus[key];
    const day = d.getDay();
    const isHoliday = holidays[key];

    let dayClass = "";
    if (day === 0) dayClass = "sun";
    if (day === 6) dayClass = "sat";

    weekEl.innerHTML += `
      <div class="day ${dayClass} ${isHoliday ? "holiday" : ""}">
        <div class="date">
          ${d.getMonth() + 1}/${d.getDate()}（${weekNames[day]}）
          ${isHoliday ? "・祝" : ""}
        </div>

        <div class="meal breakfast">
          <span>朝</span>${menu?.breakfast || ""}
        </div>

        <div class="meal lunch">
          <span>昼</span>${menu?.lunch || ""}
        </div>

        <div class="meal dinner">
          <span>夜</span>${menu?.dinner || ""}
        </div>

        <div class="memo">${menu?.memo || ""}</div>
      </div>
    `;
  }
}
</script>

</body>
</html>
