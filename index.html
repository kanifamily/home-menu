<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今月のごはん</title>

<style>
body {
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  padding:16px;
}

h1 {
  text-align:center;
  margin-bottom:20px;
}

.day {
  padding:12px;
  border-bottom:1px solid #333;
}

.date {
  font-size:14px;
  color:#aaa;
}

.main {
  font-size:20px;
  font-weight:bold;
}

.sub {
  font-size:14px;
  color:#ccc;
}
</style>
</head>

<body>

<h1>5月のメニュー</h1>
<div id="menu"></div>

<script>
const data = [
  {date:"5/19(火)", main:"ブリの照り焼き", sub:"味噌汁・ほうれん草"},
  {date:"5/20(水)", main:"鶏もも塩焼き", sub:"サラダ・スープ"},
  {date:"5/21(木)", main:"焼きそば", sub:"冷奴"},
  {date:"5/22(金)", main:"カレー", sub:"サラダ"},
  {date:"5/23(土)", main:"餃子", sub:"ビール"},
  {date:"5/24(日)", main:"鍋", sub:"ごはん"}
];

const menu = document.getElementById("menu");

data.forEach(d => {
  menu.innerHTML += `
    <div class="day">
      <div class="date">${d.date}</div>
      <div class="main">${d.main}</div>
      <div class="sub">${d.sub}</div>
    </div>
  `;
});
</script>

</body>
</html>
